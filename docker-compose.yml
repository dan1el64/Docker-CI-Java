services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-7.6.2}
    volumes:
      - ./Config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      ES_JAVA_OPTS: -Xmx512m -Xms512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set a local value in .env}
      discovery.type: single-node
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-7.6.2}
    volumes:
      - ./Config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./Config/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./Logs/ELK:/home/logs:ro
    environment:
      LS_JAVA_OPTS: -Xmx256m -Xms256m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set a local value in .env}
    depends_on: [elasticsearch]
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-7.6.2}
    volumes:
      - ./Config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set a local value in .env}
    depends_on: [elasticsearch]
  minio:
    image: minio/minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a local value in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a local value in .env}
    command: server --console-address :9001 /data
  cpit_dei:
    profiles: [legacy-app]
    build:
      context: .
      dockerfile: JavaBuild/Dockerfile
    volumes:
      - ./Config/dei:/app/config:ro
      - ./Logs:/home/dei-v2/logs
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/demo}
      DB_USER: ${DB_USER:-demo}
      DB_PASSWORD: ${DB_PASSWORD:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a local value in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a local value in .env}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  elasticsearch:
  minio_storage:
